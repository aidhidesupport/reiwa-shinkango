services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: reiwa_shinkango
      POSTGRES_USER: reiwa
      POSTGRES_PASSWORD: reiwa_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://reiwa:reiwa_password_change_me@db:5432/reiwa_shinkango
      DIRECT_URL: postgresql://reiwa:reiwa_password_change_me@db:5432/reiwa_shinkango
      SESSION_SECRET: replace-with-a-long-random-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-admin-password
    ports:
      - "3000:3000"

volumes:
  postgres-data:
