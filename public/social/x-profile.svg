  <rect x="22" y="22" width="356" height="356" rx="36" fill="none" stroke="#f4ede1" stroke-width="3"/>
  <rect x="34" y="34" width="332" height="332" rx="29" fill="none" stroke="#8fc4bb" stroke-width="1" opacity=".72"/>
